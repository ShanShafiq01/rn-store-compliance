          - heading "What is Android Developer Verification?" [level=2] [ref=f9e221]
          - paragraph [ref=f9e222]: "Google requires developers to verify ownership of their app before allowing release distribution. This includes:"
          - list [ref=f9e223]:
            - listitem [ref=f9e224]:
              - text: Registering your
              - strong [ref=f9e225]: package name
