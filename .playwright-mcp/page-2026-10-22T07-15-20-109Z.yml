          - paragraph [ref=f9e275]:
            - text: Instead of manually creating files in Android folder, we use an
            - strong [ref=f9e276]: Expo Config Plugin
            - text: .
          - paragraph [ref=f9e277]: 4.1 Create Plugin File
          - paragraph [ref=f9e278]: "Create this file in your project:"
          - generic [ref=f9e279]: plugins/withAdiRegistration.js
          - paragraph [ref=f9e281]: "Code:"
          - generic [ref=f9e282]: "const { withDangerousMod } = require('@expo/config-plugins');const fs = require('fs');const path = require('path');module.exports = function withAdiRegistration(config) { return withDangerousMod(config, [ 'android', async (config) => { const assetsDir = path.join( config.modRequest.platformProjectRoot, 'app', 'src', 'main', 'assets' ); // Create assets directory if it doesn't exist fs.mkdirSync(assetsDir, { recursive: true }); // Create verification file const filePath = path.join( assetsDir, 'adi-registration.properties' ); fs.writeFileSync( filePath, 'CRWWSGEIA89AAAEEAAAEEAAAAAA' ); return config; }, ]);};"
          - 'heading "Step 5: Register Plugin in Expo Config" [level=2] [ref=f9e284]'
